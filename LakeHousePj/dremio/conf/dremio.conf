# Dremio Configuration for LakeHouse
# This file is mounted to /opt/dremio/conf/dremio.conf in container
# Minimal config - Dremio will use defaults for most settings

# Paths (required)
paths: {
  local: ${DREMIO_HOME}"/data"
  dist: "pdfs://"${paths.local}"/pdfs"
  spilling: [${paths.local}"/spilling"]
}

