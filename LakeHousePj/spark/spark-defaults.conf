# ============================================
# Spark Application Configuration - CLUSTER MODE
# ============================================
# spark.app.name removed - each job should specify its own name
spark.master                        spark://spark-master:7077
spark.submit.deployMode             client
spark.driver.memory                 1g
spark.executor.memory               768m
spark.executor.memoryOverhead       256m
spark.executor.cores                2
spark.executor.instances            2
spark.driver.maxResultSize          2g
spark.driver.host                   spark-master
spark.sql.shuffle.partitions        20

# ============================================
# Iceberg Configuration - Multiple Catalogs
# ============================================
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog cho Bronze layer
spark.sql.catalog.bronze            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bronze.type       hive
spark.sql.catalog.bronze.uri        thrift://hive-metastore:9083
spark.sql.catalog.bronze.warehouse  s3a://bronze/lakehouse

# Catalog cho Silver layer
spark.sql.catalog.silver            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.silver.type       hive
spark.sql.catalog.silver.uri        thrift://hive-metastore:9083
spark.sql.catalog.silver.warehouse  s3a://silver/lakehouse

# Catalog cho Gold layer
spark.sql.catalog.gold              org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.gold.type         hive
spark.sql.catalog.gold.uri          thrift://hive-metastore:9083
spark.sql.catalog.gold.warehouse    s3a://gold/lakehouse

# Legacy catalog 'lakehouse' = Bronze layer (KEEP AS-IS for backward compatibility)
# All existing Bronze pipelines use this catalog
spark.sql.catalog.lakehouse         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type    hive
spark.sql.catalog.lakehouse.uri     thrift://hive-metastore:9083
spark.sql.catalog.lakehouse.warehouse   s3a://bronze/lakehouse

# Default catalog = Bronze (DO NOT CHANGE - Bronze is stable)
spark.sql.defaultCatalog            lakehouse
spark.sql.catalog.lakehouse.cache-enabled   false

# Iceberg commit and metadata settings
spark.sql.iceberg.commit.timeout                300000
spark.sql.catalog.silver.cache-enabled          true
spark.sql.catalog.silver.cache.expiration-interval-ms  60000

# ============================================
# Hive Metastore Configuration (prevents Derby usage)
# ============================================
spark.sql.catalogImplementation     hive
spark.hadoop.hive.metastore.uris    thrift://hive-metastore:9083
# NOTE: Default warehouse dir - each catalog overrides this
spark.hadoop.hive.metastore.warehouse.dir   s3a://bronze/lakehouse

# CRITICAL: Disable embedded metastore mode
spark.hadoop.hive.metastore.schema.verification     false
spark.hadoop.hive.metastore.schema.verification.record.version  false
spark.hadoop.datanucleus.autoCreateSchema           false
spark.hadoop.datanucleus.fixedDatastore             true

# Force use of remote Thrift metastore (NOT local embedded)
spark.hadoop.hive.metastore.local                   false
spark.hadoop.hive.metastore.fastpath                false

# Metastore connection settings
spark.hadoop.hive.metastore.client.socket.timeout   600000
spark.hadoop.hive.metastore.client.connect.retry.delay  5

# ============================================
# JAR Dependencies
# ============================================
spark.jars                          /opt/spark/jars/postgresql-42.7.2.jar
spark.driver.extraClassPath         /opt/spark/jars/postgresql-42.7.2.jar
spark.executor.extraClassPath       /opt/spark/jars/postgresql-42.7.2.jar

# ============================================
# S3/MinIO Configuration
# ============================================
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# S3A Performance tuning
spark.hadoop.fs.s3a.block.size                  128M
spark.hadoop.fs.s3a.buffer.dir                  /tmp
spark.hadoop.fs.s3a.committer.name              directory
spark.hadoop.fs.s3a.committer.staging.conflict-mode append
spark.hadoop.fs.s3a.fast.upload                 true
spark.hadoop.fs.s3a.multipart.size              104857600
spark.hadoop.fs.s3a.connection.timeout          200000

# ============================================
# Spark UI and History Server
# ============================================
spark.ui.enabled                    true
spark.ui.port                       4040
spark.eventLog.enabled              true
spark.eventLog.dir                  /opt/spark/spark-events
spark.history.fs.logDirectory       /opt/spark/spark-events
spark.history.ui.port               18080

# ============================================
# Serialization and Compression
# ============================================
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.sql.parquet.compression.codec snappy
spark.sql.parquet.mergeSchema       false
spark.sql.parquet.filterPushdown    true

# ============================================
# Dynamic Allocation (DISABLED - Use Fixed Executors)
# ============================================
# NOTE: We use fixed executor instances for predictable resource allocation
# Heavy jobs (tiktok_comments, hotels_reviews) get 2 executors
# Light jobs can override to 1 executor in DAG config
spark.dynamicAllocation.enabled             false
spark.shuffle.service.enabled               false

# ============================================
# Iceberg Table Properties
# ============================================
spark.sql.catalog.lakehouse.table-default.write.format.default  parquet
spark.sql.catalog.lakehouse.table-default.write.parquet.compression-codec  snappy

# ============================================
# Suppress Hadoop Metrics Warnings
# ============================================
spark.hadoop.fs.s3a.metrics.enabled                  false
spark.hadoop.hadoop.metrics.reporters                 