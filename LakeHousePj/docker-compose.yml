networks:
  lakehouse_network:
    name: lakehouse-network
    driver: bridge

services:
  # ============================================
  # PostgreSQL - Metadata Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: lakehouse_postgres
    hostname: postgres
    networks:
      - lakehouse_network
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # MinIO - S3-Compatible Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: lakehouse_minio
    hostname: minio
    networks:
      - lakehouse_network
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_STORAGE_CLASS_STANDARD: "EC:0"  # Disable erasure coding
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001" --compat
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ============================================
  # MinIO Client - Auto Create Buckets
  # ============================================
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse_minio_init
    networks:
      - lakehouse_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb myminio/${BRONZE_BUCKET} --ignore-existing;
      mc mb myminio/${SILVER_BUCKET} --ignore-existing;
      mc mb myminio/${GOLD_BUCKET} --ignore-existing;
      mc mb myminio/scratch --ignore-existing;
      echo 'Buckets created successfully';
      mc anonymous set download myminio/${BRONZE_BUCKET};
      mc anonymous set download myminio/${SILVER_BUCKET};
      mc anonymous set download myminio/${GOLD_BUCKET};
      mc anonymous set download myminio/scratch;
      echo 'Bucket policies set successfully';
      exit 0;
      "

  # ============================================
  # Hive Metastore - Metadata Management
  # ============================================
  hive-metastore:
    build:
      context: ./hive
      dockerfile: Dockerfile
    container_name: lakehouse-hive-metastore
    hostname: hive-metastore
    networks:
      - lakehouse_network
    ports:
      - "${HIVE_METASTORE_PORT}:9083"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_HEAPSIZE: 3072
      SERVICE_OPTS: >-
        -Xmx3072m
        -Xms2048m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./hive/init/hive-site.xml:/opt/hive/conf/hive-site.xml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9083"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Thêm vào services:
  hive-server2:
    build:
      context: ./hive
      dockerfile: Dockerfile
    container_name: lakehouse-hive-server2
    hostname: hive-server2
    networks:
      - lakehouse_network
    ports:
      - "10000:10000"
    environment:
      JAVA_OPTS: "-Dhive.conf.dir=/opt/hive/conf"
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      SKIP_SCHEMA_INIT: "true"  # Skip schema init - already done by metastore
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
    depends_on:
      hive-metastore:
        condition: service_healthy
    volumes:
      - ./hive/init/hive-site.xml:/opt/hive/conf/hive-site.xml
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  # ============================================
  # Spark Master - Cluster Coordinator
  # ============================================
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: lakehouse_spark_master
    hostname: spark-master
    networks:
      - lakehouse_network
    ports:
      - "8080:8080"    # Spark Master Web UI
      - "7077:7077"    # Spark Master port
      - "4040:4040"    # Application UI (first app)
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/logs:/opt/spark/logs
      - ./spark/spark-events:/opt/spark/spark-events
      - ./data:/data
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-1-spark-master.out
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # Spark Worker 1 - Processing Node
  # ============================================
  spark-worker-1:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: lakehouse_spark_worker_1
    hostname: spark-worker-1
    networks:
      - lakehouse_network
    ports:
      - "8081:8081"    # Worker 1 Web UI
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_WEBUI_PORT: 8081
    deploy:
      resources:
        limits:
          memory: 3.5g    # Hard limit: Container bị kill nếu vượt 3.5GB (an toàn với 9.6GB free)
        reservations:
          memory: 2g      # Soft limit: Đảm bảo có ít nhất 2GB khi start
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/logs:/opt/spark/logs
      - ./spark/spark-events:/opt/spark/spark-events
      - ./data:/data
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-1-spark-worker-1.out
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # Spark History Server - Job History UI
  # ============================================
  spark-history:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: lakehouse_spark_history
    hostname: spark-history
    networks:
      - lakehouse_network
    ports:
      - "18080:18080"  # History Server Web UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./spark/spark-events:/opt/spark/spark-events
    command: >
      bash -c "
      /opt/spark/sbin/start-history-server.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.history.HistoryServer-1-spark-history.out
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # pgAdmin - PostgreSQL Web UI
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: lakehouse_pgadmin
    hostname: pgadmin
    networks:
      - lakehouse_network
    ports:
      - "5050:80"
    user: "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Airflow Postgres - Metadata Database
  # ============================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: lakehouse_airflow_postgres
    hostname: airflow-postgres
    networks:
      - lakehouse_network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Airflow - Webserver + Scheduler (All-in-One)
  # ============================================
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: lakehouse_airflow
    hostname: airflow
    networks:
      - lakehouse_network
    ports:
      - "8082:8080"
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__SCHEDULER__HEARTBEAT_SEC: 5
      AIRFLOW__SCHEDULER__HEALTH_CHECK_THRESHOLD: 240
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      # Database connection pool settings to handle DNS/network issues
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: 5
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 1800
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: 10
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@lakehouse.local
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./spark/jobs:/opt/airflow/spark-jobs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username admin \
        --password admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@lakehouse.local || true &&
      airflow webserver & airflow scheduler
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============================================
  # Dremio - Data Lakehouse Query Engine
  # ============================================
  dremio:
    build:
      context: ./dremio
      dockerfile: Dockerfile
    container_name: lakehouse-dremio
    hostname: dremio
    networks:
      - lakehouse_network
    ports:
      - "9047:9047"    # Dremio Web UI
      - "31010:31010"  # Dremio client port (ODBC/JDBC)
      - "32010:32010"  # Dremio flight port
      - "45678:45678"  # Dremio coordinator port
    volumes:
      - ./dremio/data:/opt/dremio/data
      - ./dremio/conf:/opt/dremio/conf
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ============================================
  # MLflow - ML Experiment Tracking
  # ============================================
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: lakehouse_mlflow
    hostname: mlflow
    networks:
      - lakehouse_network
    ports:
      - "5001:5000"  # MLflow UI
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://gold/mlflow/artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./mlflow/data:/mlflow/data
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      --default-artifact-root s3://gold/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # Gradio - Recommendation Web App
  # ============================================
  gradio:
    build:
      context: ./gradio
      dockerfile: Dockerfile
    container_name: lakehouse_gradio
    hostname: gradio
    networks:
      - lakehouse_network
    ports:
      - "7860:7860"  # Gradio UI
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      no_proxy: localhost,127.0.0.1
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ./gradio:/app
      - ./spark/jobs:/opt/spark/jobs  # Access to utils
    depends_on:
      - mlflow
      - spark-master
      - hive-metastore
      - minio
    restart: unless-stopped
     # ============================================
  # Apache Superset - Data Visualization
  # ============================================
  # Apache Superset - Data Visualization
  # ============================================
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: lakehouse_superset
    hostname: superset
    networks:
      - lakehouse_network
    ports:
      - "8088:8088"  # Superset UI
    environment:
      SUPERSET_SECRET_KEY: "lakehouse-superset-secret-key-change-in-prod"
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
      FLASK_APP: "superset.app:create_app"
      PYTHONPATH: "/app"
      SUPERSET_SQLALCHEMY_DATABASE_URI: postgresql://lakehouse_user:lakehouse_pass@postgres:5432/superset_db
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - ./superset/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped